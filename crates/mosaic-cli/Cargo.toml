[package]
name = "mosaic-cli"
version = "0.9.2"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
mosaic-core = { path = "../mosaic-core" }
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "time"] }

[features]
default = ["native-tun"]
native-tun = ["mosaic-core/native-tun"]
