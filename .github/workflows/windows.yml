name: windows-build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'android/**'
      - 'scripts/*.sh'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - 'android/**'
      - 'scripts/*.sh'
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true

      # --release: the tests reuse the dependencies compiled for the app build below.
      - name: Unit tests (core)
        run: cargo test --release -p mosaic-core

      # The app bundles .\engines, so it must exist before the build.
      - name: Download engines and geo files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get-engines.ps1

      - name: Build app
        run: cargo build --release -p mosaic

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Mosaic | Out-Null
          Copy-Item target/release/mosaic.exe dist/Mosaic/
          Copy-Item engines dist/Mosaic/engines -Recurse
          Copy-Item README.md dist/Mosaic/
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/Mosaic/ }

      - uses: actions/upload-artifact@v4
        with:
          name: Mosaic-windows-x64-portable
          path: dist/Mosaic
