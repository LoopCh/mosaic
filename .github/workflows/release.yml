name: release

# Push a tag like v0.4.0 (matching the version in Cargo.toml / tauri.conf.json)
# to build the installer and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check that the tag matches the app version
        shell: pwsh
        run: |
          $ver = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$ver" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match version $ver in tauri.conf.json" }

      - name: Unit tests (core)
        run: cargo test --release -p mosaic-core

      - name: Download engines and geo files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/get-engines.ps1

      - name: Build installer (Tauri + NSIS)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect release files
        shell: pwsh
        run: |
          $ver = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out, portable/Mosaic | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe out/
          Copy-Item target/release/mosaic.exe portable/Mosaic/
          Copy-Item engines portable/Mosaic/engines -Recurse
          Copy-Item README.md portable/Mosaic/
          if (Test-Path LICENSE) { Copy-Item LICENSE portable/Mosaic/ }
          Compress-Archive -Path portable/Mosaic -DestinationPath "out/Mosaic_${ver}_x64-portable.zip"
          Get-ChildItem out -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii out/SHA256SUMS
          Get-Content out/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  android-publish:
    needs: [release, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mosaic-android-arm64
          path: out
      - name: Checksum
        run: cd out && sha256sum *.apk > SHA256SUMS-android && cat SHA256SUMS-android
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

  linux:
    uses: ./.github/workflows/linux.yml
    secrets: inherit

  linux-publish:
    needs: [release, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mosaic-linux-x64
          path: out
      - name: Checksum
        run: cd out && sha256sum * > SHA256SUMS-linux && cat SHA256SUMS-linux
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

  # Arch Linux: update the AUR package mosaic-vpn-bin (installable with paru / yay).
  # Runs only when the AUR_SSH_PRIVATE_KEY secret is set.
  aur-publish:
    needs: [linux-publish]
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.AUR_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.AUR_KEY != ''
        with:
          name: Mosaic-linux-x64
          path: out
      - name: Fill in version and checksum
        if: env.AUR_KEY != ''
        run: |
          ver="${GITHUB_REF_NAME#v}"
          deb="out/Mosaic_${ver}_amd64.deb"
          test -f "$deb" || { echo "::error::$deb not found"; ls out; exit 1; }
          sum=$(sha256sum "$deb" | cut -d' ' -f1)
          f=packaging/aur/mosaic-vpn-bin/PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${ver}/; s/^pkgrel=.*/pkgrel=1/; s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${sum}')/" "$f"
          grep -E '^(pkgver|pkgrel|sha256sums_x86_64)=' "$f"
      - uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        if: env.AUR_KEY != ''
        with:
          pkgname: mosaic-vpn-bin
          pkgbuild: packaging/aur/mosaic-vpn-bin/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ github.ref_name }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
          test: true
