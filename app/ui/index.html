<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mosaic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
        <rect x="5" y="5" width="10" height="10" rx="3" fill="#7c5cff"/>
        <rect x="17" y="5" width="10" height="10" rx="3" fill="#38bdf8"/>
        <rect x="5" y="17" width="10" height="10" rx="3" fill="#34d399"/>
        <rect x="17" y="17" width="10" height="10" rx="3" fill="#f472b6"/>
      </svg>
      <span>Mosaic</span>
    </div>
    <nav class="nav">
      <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span data-i18n="nav.home"></span></button>
      <button data-view="nodes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg><span data-i18n="nav.nodes"></span></button>
      <button data-view="rules"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="15" cy="18" r="2"/></svg><span data-i18n="nav.rules"></span></button>
      <button data-view="conns"><svg viewBox="0 0 24 24"><path d="M4 7h12l-3-3M20 17H8l3 3"/></svg><span data-i18n="nav.conns"></span></button>
      <button data-view="engines"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg><span data-i18n="nav.engines"></span></button>
      <button data-view="logs"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg><span data-i18n="nav.logs"></span></button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-i18n="nav.settings"></span></button>
    </nav>
    <div class="side-foot">
      <span class="dot" id="side-dot"></span>
      <div>
        <div id="side-status"></div>
        <div class="muted small" id="side-sub">0.2</div>
      </div>
    </div>
  </aside>

  <main>
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="home">
        <div class="hero card">
          <button class="power" id="power">
            <span class="ring"></span>
            <svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
          </button>
          <div class="hero-state" id="hero-state"></div>
          <div class="hero-sub muted" id="hero-sub"></div>
          <div class="seg" id="mode-seg">
            <button data-mode="system_proxy" data-i18n="mode.proxy"></button>
            <button data-mode="tun" data-i18n="mode.tun"></button>
          </div>
          <div class="hint muted small" id="mode-hint"></div>
        </div>

        <div class="home-right">
          <div class="card node-card" id="current-node"></div>
          <div class="tiles">
            <div class="tile">
              <div class="tile-label" data-i18n="home.down"></div>
              <div class="tile-val" id="rate-down">0</div>
              <div class="muted small" id="total-down"></div>
            </div>
            <div class="tile">
              <div class="tile-label" data-i18n="home.up"></div>
              <div class="tile-val" id="rate-up">0</div>
              <div class="muted small" id="total-up"></div>
            </div>
            <div class="tile">
              <div class="tile-label" data-i18n="home.conns"></div>
              <div class="tile-val" id="conn-count">0</div>
              <div class="muted small" id="uptime">—</div>
            </div>
          </div>
          <div class="card chart-card">
            <div class="chart-head"><span data-i18n="home.chart"></span><span class="legend"><i class="lg-down"></i><span data-i18n="home.legend.down"></span> <i class="lg-up"></i><span data-i18n="home.legend.up"></span></span></div>
            <canvas id="spark" height="120"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- NODES -->
    <section class="view" id="view-nodes">
      <header class="view-head">
        <h1 data-i18n="nav.nodes"></h1>
        <div class="actions">
          <button class="btn primary" id="btn-import" data-i18n="nodes.import"></button>
          <button class="btn" id="btn-test" data-i18n="nodes.test"></button>
          <button class="btn" id="btn-update-subs" data-i18n="nodes.updateSubs"></button>
        </div>
      </header>
      <div class="card import hidden" id="import-panel">
        <textarea id="import-text" spellcheck="false" data-i18n-ph="nodes.importPh"></textarea>
        <div class="row">
          <button class="btn primary" id="import-go" data-i18n="nodes.add"></button>
          <button class="btn ghost" id="import-paste" data-i18n="nodes.paste"></button>
          <span class="muted small" id="import-hint"></span>
        </div>
      </div>
      <div id="subs" class="subs"></div>
      <div class="filter-row">
        <input id="node-filter" data-i18n-ph="nodes.filterPh" />
        <span class="muted small" id="node-count"></span>
      </div>
      <div id="node-list" class="node-list"></div>
    </section>

    <!-- RULES -->
    <section class="view" id="view-rules">
      <header class="view-head">
        <h1 data-i18n="nav.rules"></h1>
        <div class="actions">
          <button class="btn" id="preset-country" data-i18n="rules.presetCountry"></button>
          <button class="btn" data-preset="ads" data-i18n="rules.presetAds"></button>
          <button class="btn ghost" data-preset="reset" data-i18n="rules.reset"></button>
          <button class="btn primary" id="rules-save" data-i18n="rules.apply"></button>
        </div>
      </header>
      <p class="muted lead" data-i18n="rules.lead"></p>
      <div class="card country hidden" id="country-panel">
        <span data-i18n="rules.countryLabel"></span>
        <select id="country-select"></select>
        <button class="btn primary" id="country-add" data-i18n="rules.countryAdd"></button>
        <span class="muted small" data-i18n="rules.countryHint"></span>
      </div>
      <div class="rules" id="rules"></div>
      <div class="row">
        <button class="btn ghost" id="rule-add" data-i18n="rules.add"></button>
        <div class="final"><span data-i18n="rules.final"></span> <select id="final-target"></select></div>
      </div>
      <div class="geo-status muted small" id="geo-status"></div>
    </section>

    <!-- CONNECTIONS -->
    <section class="view" id="view-conns">
      <header class="view-head">
        <h1 data-i18n="nav.conns"></h1>
        <div class="actions">
          <input id="conn-filter" data-i18n-ph="conns.filterPh" />
          <label class="check"><input type="checkbox" id="conn-active-only" /> <span data-i18n="conns.activeOnly"></span></label>
        </div>
      </header>
      <p class="muted lead" data-i18n="conns.lead"></p>
      <div class="table-wrap">
        <table class="table" id="conn-table">
          <thead><tr><th data-i18n="conns.dest"></th><th data-i18n="conns.rule"></th><th data-i18n="conns.out"></th><th class="num">↑</th><th class="num">↓</th><th class="num" data-i18n="conns.time"></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <!-- ENGINES -->
    <section class="view" id="view-engines">
      <header class="view-head"><h1 data-i18n="nav.engines"></h1>
        <div class="actions"><button class="btn" id="btn-versions" data-i18n="engines.versions"></button></div>
      </header>
      <p class="muted lead" data-i18n="engines.lead"></p>
      <div class="engine-grid" id="engine-grid"></div>
    </section>

    <!-- LOGS -->
    <section class="view" id="view-logs">
      <header class="view-head"><h1 data-i18n="nav.logs"></h1>
        <div class="actions">
          <label class="check"><input type="checkbox" id="log-follow" checked /> <span data-i18n="logs.follow"></span></label>
          <button class="btn" id="log-copy" data-i18n="logs.copy"></button>
        </div>
      </header>
      <pre class="logs" id="logs"></pre>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <header class="view-head"><h1 data-i18n="nav.settings"></h1>
        <div class="actions"><button class="btn primary" id="settings-save" data-i18n="settings.save"></button></div>
      </header>
      <div class="card form">
        <label><span data-i18n="settings.language"></span>
          <select id="set-lang">
            <option value="auto" data-i18n="settings.langAuto"></option>
            <option value="en">English</option>
            <option value="ru">Русский</option>
          </select>
        </label>
        <label><span data-i18n="settings.port"></span><input type="number" id="set-port" min="1024" max="65535" /></label>
        <label><span data-i18n="settings.tunStack"></span>
          <select id="set-tunstack">
            <option value="singbox" data-i18n="settings.tunSingbox"></option>
            <option value="native" data-i18n="settings.tunNative"></option>
          </select>
        </label>
        <label><span data-i18n="settings.strategy"></span>
          <select id="set-strategy">
            <option value="as_is" data-i18n="settings.asIs"></option>
            <option value="ip_if_non_match" data-i18n="settings.ipIfNonMatch"></option>
          </select>
        </label>
        <label class="check"><input type="checkbox" id="set-quic" /> <span data-i18n="settings.quic"></span></label>
        <label class="check"><input type="checkbox" id="set-dnsleak" /> <span data-i18n="settings.dnsLeak"></span></label>
        <div class="form-group" data-i18n="settings.groupApp"></div>
        <label class="check"><input type="checkbox" id="set-tray" /> <span data-i18n="settings.closeToTray"></span></label>
        <label class="check"><input type="checkbox" id="set-autostart" /> <span data-i18n="settings.autostart"></span></label>
        <label class="check"><input type="checkbox" id="set-autoconnect" /> <span data-i18n="settings.autoConnect"></span></label>
        <div class="form-group" data-i18n="settings.groupDns"></div>
        <label><span data-i18n="settings.remoteDns"></span><input id="set-remotedns" placeholder="1.1.1.1" /></label>
        <label><span data-i18n="settings.ipRuleDns"></span>
          <select id="set-iprule">
            <option value="remote" data-i18n="settings.ipRuleRemote"></option>
            <option value="local" data-i18n="settings.ipRuleLocal"></option>
          </select>
        </label>
        <label><span data-i18n="settings.dns"></span><input id="set-dns" placeholder="8.8.8.8" /></label>
        <label><span data-i18n="settings.testUrl"></span><input id="set-testurl" /></label>
        <label><span data-i18n="settings.ua"></span><input id="set-ua" /></label>
        <div class="muted small" id="set-info"></div>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
