<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mosaic</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
        <rect x="5" y="5" width="10" height="10" rx="3" fill="#7c5cff"/>
        <rect x="17" y="5" width="10" height="10" rx="3" fill="#38bdf8"/>
        <rect x="5" y="17" width="10" height="10" rx="3" fill="#34d399"/>
        <rect x="17" y="17" width="10" height="10" rx="3" fill="#f472b6"/>
      </svg>
      <span>Mosaic</span>
    </div>
    <nav class="nav">
      <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg><span data-i18n="nav.home"></span></button>
      <button data-view="nodes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/></svg><span data-i18n="nav.nodes"></span></button>
      <button data-view="rules"><svg viewBox="0 0 24 24"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18" cy="6" r="2"/><circle cx="15" cy="18" r="2"/></svg><span data-i18n="nav.rules"></span></button>
      <button data-view="conns"><svg viewBox="0 0 24 24"><path d="M4 7h12l-3-3M20 17H8l3 3"/></svg><span data-i18n="nav.conns"></span></button>
      <button data-view="engines"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg><span data-i18n="nav.engines"></span></button>
      <button data-view="logs"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></svg><span data-i18n="nav.logs"></span></button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-i18n="nav.settings"></span></button>
    </nav>
    <div class="side-foot">
      <span class="dot" id="side-dot"></span>
      <div>
        <div id="side-status"></div>
        <div class="muted small" id="side-sub"></div>
      </div>
    </div>
  </aside>

  <main>
    <div class="banner hidden" id="update-banner">
      <span id="update-text"></span>
      <button class="btn primary" id="update-install" data-i18n="upd.install"></button>
    </div>
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div class="home">
        <div class="hero card" id="hero" data-phase="off">
          <button class="mosaic" id="mosaic" aria-describedby="hero-state"></button>
          <div class="hero-body">
            <div class="hero-state" id="hero-state" aria-live="polite"></div>
            <div class="hero-sub muted" id="hero-sub"></div>
            <ol class="steps hidden" id="steps"></ol>
            <div class="hero-actions" id="hero-actions"></div>
            <div class="hero-meta muted small" id="hero-meta"></div>
          </div>
        </div>

        <div class="home-right">
          <button class="card node-card" id="current-node"></button>
          <div class="card routes-card hidden" id="routes"></div>
          <div class="card mode-card">
            <div class="seg" id="mode-seg">
              <button data-mode="system_proxy" data-i18n="mode.proxy" class="desktop-only"></button>
              <button data-mode="proxy" data-i18n="mode.proxyOnly"></button>
              <button data-mode="tun" data-i18n="mode.tun" data-i18n-android="mode.vpn"></button>
            </div>
            <div class="hint muted small" id="mode-hint"></div>
          </div>
          <div class="tiles">
            <div class="tile">
              <div class="tile-label" data-i18n="home.down"></div>
              <div class="tile-val" id="rate-down">0</div>
              <div class="muted small" id="total-down"></div>
            </div>
            <div class="tile">
              <div class="tile-label" data-i18n="home.up"></div>
              <div class="tile-val" id="rate-up">0</div>
              <div class="muted small" id="total-up"></div>
            </div>
            <div class="tile">
              <div class="tile-label" data-i18n="home.conns"></div>
              <div class="tile-val" id="conn-count">0</div>
              <div class="muted small" id="uptime">—</div>
            </div>
          </div>
          <div class="card chart-card">
            <div class="chart-head"><span data-i18n="home.chart"></span><span class="legend"><i class="lg-down"></i><span data-i18n="home.legend.down"></span> <i class="lg-up"></i><span data-i18n="home.legend.up"></span></span></div>
            <canvas id="spark" height="120"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- NODES -->
    <section class="view" id="view-nodes">
      <header class="view-head">
        <h1 data-i18n="nav.nodes"></h1>
        <div class="actions">
          <button class="btn primary" id="btn-import" data-i18n="nodes.import"></button>
          <button class="btn" id="btn-test" data-i18n="nodes.test"></button>
          <button class="btn" id="btn-update-subs" data-i18n="nodes.updateSubs"></button>
          <button class="btn smart-btn" id="btn-smart" aria-controls="smart-card"><i class="sdot"></i><span data-i18n="smart.title"></span></button>
        </div>
      </header>
      <div class="card import hidden" id="import-panel">
        <textarea id="import-text" spellcheck="false" data-i18n-ph="nodes.importPh"></textarea>
        <div class="row">
          <button class="btn primary" id="import-go" data-i18n="nodes.add"></button>
          <button class="btn ghost" id="import-paste" data-i18n="nodes.paste"></button>
          <button class="btn ghost android-only" id="import-qr" data-i18n="nodes.qr"></button>
          <button class="btn ghost" id="proxy-toggle" data-i18n="px.open"></button>
          <span class="muted small" id="import-hint"></span>
        </div>
        <div class="proxy-form hidden" id="proxy-form">
          <div class="px-grid">
            <label class="px-type"><span class="muted small" data-i18n="px.type"></span>
              <select id="px-type"><option value="socks5">SOCKS5</option><option value="http">HTTP</option><option value="https">HTTPS</option></select></label>
            <label class="px-host"><span class="muted small" data-i18n="px.host"></span><input id="px-host" spellcheck="false" placeholder="pl.example.com" /></label>
            <label class="px-port"><span class="muted small" data-i18n="px.port"></span><input id="px-port" inputmode="numeric" placeholder="1080" /></label>
            <label class="px-cred px-user"><span class="muted small" data-i18n="px.user"></span><input id="px-user" spellcheck="false" autocomplete="off" data-i18n-ph="px.optional" /></label>
            <label class="px-cred px-pass"><span class="muted small" data-i18n="px.pass"></span><input id="px-pass" type="password" autocomplete="new-password" data-i18n-ph="px.optional" /></label>
            <label class="px-name"><span class="muted small" data-i18n="px.name"></span><input id="px-name" data-i18n-ph="px.namePh" /></label>
          </div>
          <div class="row">
            <button class="btn primary" id="px-add" data-i18n="px.add"></button>
            <span class="muted small" data-i18n="px.hint"></span>
          </div>
        </div>
      </div>
      <div class="card smart hidden" id="smart-card">
        <label class="switch"><input type="checkbox" id="smart-toggle" /><span></span></label>
        <div><div class="set-title" data-i18n="smart.title"></div><div class="set-desc" data-i18n="smart.desc"></div></div>
        <div class="smart-state muted small" id="smart-state"></div>
      </div>
      <div class="filter-row">
        <input id="node-filter" data-i18n-ph="nodes.filterPh" />
        <select id="node-sort" class="sort-sel">
          <option value="order" data-i18n="nodes.sortOrder"></option>
          <option value="latency" data-i18n="nodes.sortLatency"></option>
          <option value="name" data-i18n="nodes.sortName"></option>
        </select>
        <span class="muted small" id="node-count"></span>
      </div>
      <div id="node-list" class="node-list"></div>
    </section>

    <!-- RULES -->
    <section class="view" id="view-rules">
      <header class="view-head">
        <h1 data-i18n="nav.rules"></h1>
        <div class="actions">
          <button class="btn" id="preset-country" data-i18n="rules.presetCountry"></button>
          <button class="btn" data-preset="ads" data-i18n="rules.presetAds"></button>
          <button class="btn ghost" data-preset="reset" data-i18n="rules.reset"></button>
          <button class="btn primary" id="rules-save" data-i18n="rules.apply"></button>
        </div>
      </header>
      <p class="muted lead" data-i18n="rules.lead"></p>
      <div class="card country hidden" id="country-panel">
        <span data-i18n="rules.countryLabel"></span>
        <select id="country-select"></select>
        <button class="btn primary" id="country-add" data-i18n="rules.countryAdd"></button>
        <span class="muted small" data-i18n="rules.countryHint"></span>
      </div>
      <div class="rules" id="rules"></div>
      <div class="row">
        <button class="btn ghost" id="rule-add" data-i18n="rules.add"></button>
        <div class="final"><span data-i18n="rules.final"></span> <select id="final-target"></select></div>
      </div>
      <div class="geo-status muted small" id="geo-status"></div>
    </section>

    <!-- CONNECTIONS -->
    <section class="view" id="view-conns">
      <header class="view-head">
        <h1 data-i18n="nav.conns"></h1>
        <div class="actions">
          <input id="conn-filter" data-i18n-ph="conns.filterPh" />
          <select id="conn-view" data-i18n-title="conns.viewTitle">
            <option value="full" data-i18n="conns.viewFull"></option>
            <option value="host" data-i18n="conns.viewHost"></option>
            <option value="domain" data-i18n="conns.viewDomain"></option>
          </select>
          <select id="conn-group" data-i18n-title="conns.groupTitle">
            <option value="none" data-i18n="conns.groupNone"></option>
            <option value="app" data-i18n="conns.groupApp"></option>
            <option value="domain" data-i18n="conns.groupDomain"></option>
            <option value="rule" data-i18n="conns.groupRule"></option>
            <option value="out" data-i18n="conns.groupOut"></option>
          </select>
          <button class="btn" id="conn-fold" data-i18n-title="conns.foldTitle">⇕</button>
          <select id="conn-sort" class="narrow-only"></select>
          <label class="check"><input type="checkbox" id="conn-active-only" /> <span data-i18n="conns.activeOnly"></span></label>
        </div>
      </header>
      <p class="muted lead" data-i18n="conns.lead"></p>
      <div class="table-wrap">
        <table class="table" id="conn-table">
          <thead><tr>
            <th class="c-sel"><input type="checkbox" id="conn-all" data-i18n-title="conns.selectAll" /></th>
            <th class="c-app" data-sort="app" data-i18n="conns.app"></th>
            <th class="c-dest" data-sort="dest" data-i18n="conns.dest"></th>
            <th class="c-rule" data-sort="rule" data-i18n="conns.rule"></th>
            <th class="c-out" data-sort="out" data-i18n="conns.out"></th>
            <th class="c-up num" data-sort="up">↑</th>
            <th class="c-down num" data-sort="down">↓</th>
            <th class="c-time num" data-sort="time" data-i18n="conns.time"></th>
            <th class="c-act"></th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="selbar hidden" id="conn-selbar">
        <span id="conn-selcount"></span>
        <button class="btn primary" id="conn-to-rules" data-i18n="conns.toRules"></button>
        <button class="btn ghost" id="conn-clear" data-i18n="conns.clearSel"></button>
      </div>
    </section>

    <!-- ENGINES -->
    <section class="view" id="view-engines">
      <header class="view-head"><h1 data-i18n="nav.engines"></h1>
        <div class="actions">
          <button class="btn ghost" id="btn-engines-reset" data-i18n="engines.reset"></button>
          <button class="btn" id="btn-engines-check" data-i18n="engines.check"></button>
        </div>
      </header>
      <p class="muted lead" data-i18n="engines.lead"></p>
      <div class="engine-grid" id="engine-grid"></div>
    </section>

    <!-- LOGS -->
    <section class="view" id="view-logs">
      <header class="view-head"><h1 data-i18n="nav.logs"></h1>
        <div class="actions">
          <button class="btn primary" id="log-report" data-i18n="logs.report"></button>
          <button class="btn desktop-only" id="log-folder" data-i18n="logs.folder"></button>
          <button class="btn" id="log-copy" data-i18n="logs.copy"></button>
        </div>
      </header>
      <p class="muted lead" data-i18n="logs.lead"></p>
      <div class="log-tools">
        <input id="log-filter" data-i18n-ph="logs.filterPh" />
        <div class="seg" id="log-level">
          <button data-level="all" class="active" data-i18n="logs.all"></button>
          <button data-level="warn" data-i18n="logs.warn"></button>
          <button data-level="error" data-i18n="logs.errors"></button>
        </div>
        <select id="log-source"></select>
        <label class="check" data-i18n-title="logs.verboseTip"><input type="checkbox" id="log-verbose" /> <span data-i18n="logs.verbose"></span></label>
        <label class="check"><input type="checkbox" id="log-follow" checked /> <span data-i18n="logs.follow"></span></label>
      </div>
      <div class="logview" id="logs" role="log" aria-live="off"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <header class="view-head"><h1 data-i18n="nav.settings"></h1>
        <div class="actions"><button class="btn primary" id="settings-save" data-i18n="settings.save"></button></div>
      </header>
      <div class="settings">
      <div class="card set-card">
        <h2 data-i18n="sec.general"></h2>
        <div class="set-row desktop-only"><div class="set-text"><div class="set-title" id="set-version"></div><div class="set-desc" data-i18n="set.updates.d"></div></div><div class="set-ctl set-ctl-row"><label class="switch"><input type="checkbox" id="set-updates" /><span></span></label><button class="btn" id="btn-app-check" data-i18n="upd.checkNow"></button></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.lang.t"></div><div class="set-desc" data-i18n="set.lang.d"></div></div><div class="set-ctl"><select id="set-lang"><option value="auto" data-i18n="set.lang.auto"></option><option value="en">English</option><option value="ru">Русский</option></select></div></div>
        <div class="set-row desktop-only"><div class="set-text"><div class="set-title" data-i18n="set.tray.t"></div><div class="set-desc" data-i18n="set.tray.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-tray" /><span></span></label></div></div>
        <div class="set-row desktop-only"><div class="set-text"><div class="set-title" data-i18n="set.autostart.t"></div><div class="set-desc" data-i18n="set.autostart.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-autostart" /><span></span></label></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.autoconnect.t"></div><div class="set-desc" data-i18n="set.autoconnect.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-autoconnect" /><span></span></label></div></div>
        <div class="set-row desktop-only"><div class="set-text"><div class="set-title" data-i18n="set.startup.t"></div><div class="set-desc" data-i18n="set.startup.d"></div></div><div class="set-ctl"><select id="set-startup"><option value="last" data-i18n="set.startup.last"></option><option value="system_proxy" data-i18n="mode.proxy"></option><option value="proxy" data-i18n="mode.proxyOnly"></option><option value="tun" data-i18n="mode.tun"></option></select></div></div>
      </div>
      <div class="card set-card">
        <h2 data-i18n="sec.connection"></h2>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.port.t"></div><div class="set-desc" data-i18n="set.port.d"></div></div><div class="set-ctl"><input type="number" id="set-port" placeholder="7890" /></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.lan.t"></div><div class="set-desc" data-i18n="set.lan.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-lan" /><span></span></label></div></div>
      </div>
      <div class="card set-card android-only">
        <h2 data-i18n="set.apps.h"></h2>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.apps.t"></div><div class="set-desc" data-i18n="set.apps.d"></div></div><div class="set-ctl"><select id="set-appsmode"><option value="all" data-i18n="set.apps.all"></option><option value="bypass" data-i18n="set.apps.bypass"></option><option value="only" data-i18n="set.apps.only"></option></select></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.apps.list"></div><div class="set-desc" id="set-apps-summary"></div></div><div class="set-ctl"><button class="btn" id="btn-apps" data-i18n="set.apps.choose"></button></div></div>
      </div>
      <div class="card set-card">
        <h2 data-i18n="sec.tun" data-i18n-android="sec.vpn"></h2>
        <div class="set-row desktop-only"><div class="set-text"><div class="set-title" data-i18n="set.tunstack.t"></div><div class="set-desc" data-i18n="set.tunstack.d"></div></div><div class="set-ctl"><select id="set-tunstack"><option value="singbox" data-i18n="settings.tunSingbox"></option><option value="native" data-i18n="settings.tunNative"></option></select></div></div>
        <div class="set-row windows-only"><div class="set-text"><div class="set-title" data-i18n="set.dnsleak.t"></div><div class="set-desc" data-i18n="set.dnsleak.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-dnsleak" /><span></span></label></div></div>
        <div class="set-row desktop-only"><div class="set-text"><div class="set-title" data-i18n="set.ks.t"></div><div class="set-desc" data-i18n="set.ks.d"></div><div class="set-desc ks-note" id="ks-note"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-ks" /><span></span></label></div></div>
        <div class="set-row android-only"><div class="set-text"><div class="set-title" data-i18n="set.ks.t"></div><div class="set-desc" data-i18n="set.ksAndroid.d"></div><div class="set-desc ks-note" id="ks-android-state"></div></div><div class="set-ctl"><button class="btn" id="ks-open-vpn" data-i18n="set.ksAndroid.open"></button></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.webrtc.t"></div><div class="set-desc" data-i18n="set.webrtc.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-webrtc" /><span></span></label></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.quic.t"></div><div class="set-desc" data-i18n="set.quic.d"></div></div><div class="set-ctl"><label class="switch"><input type="checkbox" id="set-quic" /><span></span></label></div></div>
      </div>
      <div class="card set-card">
        <h2 data-i18n="sec.dns"></h2>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.remotedns.t"></div><div class="set-desc" data-i18n="set.remotedns.d"></div></div><div class="set-ctl"><input type="text" id="set-remotedns" placeholder="1.1.1.1" /></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.strategy.t"></div><div class="set-desc" data-i18n="set.strategy.d"></div></div><div class="set-ctl"><select id="set-strategy"><option value="as_is" data-i18n="settings.asIs"></option><option value="ip_if_non_match" data-i18n="settings.ipIfNonMatch"></option></select></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.iprule.t"></div><div class="set-desc" data-i18n="set.iprule.d"></div></div><div class="set-ctl"><select id="set-iprule"><option value="remote" data-i18n="settings.ipRuleRemote"></option><option value="local" data-i18n="settings.ipRuleLocal"></option></select></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.directdns.t"></div><div class="set-desc" data-i18n="set.directdns.d"></div></div><div class="set-ctl"><input type="text" id="set-dns" placeholder="8.8.8.8" /></div></div>
      </div>
      <div class="card set-card">
        <h2 data-i18n="sec.advanced"></h2>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.subs.t"></div><div class="set-desc" data-i18n="set.subs.d"></div></div><div class="set-ctl"><select id="set-subs"><option value="0" data-i18n="set.subs.off"></option><option value="6" data-i18n="set.subs.6"></option><option value="12" data-i18n="set.subs.12"></option><option value="24" data-i18n="set.subs.24"></option></select></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.testurl.t"></div><div class="set-desc" data-i18n="set.testurl.d"></div></div><div class="set-ctl"><input type="text" id="set-testurl" placeholder="http://www.gstatic.com/generate_204" /></div></div>
        <div class="set-row"><div class="set-text"><div class="set-title" data-i18n="set.ua.t"></div><div class="set-desc" data-i18n="set.ua.d"></div></div><div class="set-ctl"><input type="text" id="set-ua" placeholder="Mosaic/0.2" /></div></div>
      </div>
        <div class="muted small set-info" id="set-info"></div>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
