[package]
name = "mosaic"
version = "0.11.5"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Mosaic — multi-core VPN client"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mosaic-core = { path = "../../crates/mosaic-core" }
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Always embed the UI from ../ui (no dev server needed): `cargo run -p mosaic` just works.
default = ["custom-protocol", "native-tun"]
custom-protocol = ["tauri/custom-protocol"]
# Mosaic’s own TUN stack (Windows: wintun, Linux: mosaic-tun-helper). On by default.
native-tun = ["mosaic-core/native-tun"]
