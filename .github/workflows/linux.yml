name: linux

on:
  push:
    branches: ["**"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'android/**'
      - 'scripts/get-engines.ps1'
      - 'scripts/get-engines-android.sh'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'android/**'
      - 'scripts/get-engines.ps1'
      - 'scripts/get-engines-android.sh'
  workflow_dispatch:
  workflow_call:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 22.04: the AppImage then runs on older distributions too (glibc 2.35+).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System libraries (WebKitGTK, tray, AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev file rpm libfuse2

      # --release: the tests reuse the dependencies compiled for the packages below.
      - name: Unit tests (core)
        run: cargo test --release -p mosaic-core --features native-tun

      - name: Download engines and geo files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/get-engines-linux.sh

      # Shipped next to Mosaic (/usr/bin): creates the interface for the native TUN stack.
      - name: TUN helper
        run: |
          cargo build --release -p mosaic-tun-helper
          mkdir -p app/src-tauri/binaries
          cp target/release/mosaic-tun-helper app/src-tauri/binaries/mosaic-tun-helper-x86_64-unknown-linux-gnu

      - name: Build packages (deb, rpm)
        working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,rpm

      # The bundler downloads its AppImage tools from GitHub on every run and gives up on the
      # first error (504s happen). Fetch them with retries and keep them cached; the bundler
      # uses files already present in ~/.cache/tauri.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-appimage-tools-v1

      - name: AppImage tools
        continue-on-error: true
        run: |
          d="$HOME/.cache/tauri"; mkdir -p "$d"
          get() { [ -s "$d/$2" ] || curl -fsSL --retry 8 --retry-delay 10 --retry-all-errors -o "$d/$2" "$1"; chmod +x "$d/$2"; }
          get https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 AppRun-x86_64
          get https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage linuxdeploy-x86_64.AppImage
          get https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
          ls -la "$d"

      # Separate step: if AppImage packaging fails, the deb/rpm are still published.
      - name: Build AppImage
        id: appimage
        continue-on-error: true
        working-directory: app/src-tauri
        env:
          # linuxdeploy's bundled strip cannot handle newer binaries; FUSE is not needed in CI.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage --verbose

      - name: Collect
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/
          cp target/release/bundle/rpm/*.rpm out/
          cp target/release/bundle/appimage/*.AppImage out/ 2>/dev/null || echo "::warning::AppImage was not built (see the 'Build AppImage' step)"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Mosaic-linux-x64
          path: out/*
