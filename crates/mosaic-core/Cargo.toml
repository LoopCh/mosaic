[package]
name = "mosaic-core"
version = "0.7.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Mosaic hub: unified config model, routing and engine orchestration"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

# Mosaic's own TUN stack: wintun on Windows, a VpnService file descriptor on Android.
ipstack = { version = "1.0", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = { version = "0.5", optional = true }

[features]
default = []
native-tun = ["dep:ipstack", "dep:wintun"]
